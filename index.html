<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Web Đáp Ứng - Dự Án Cuối Khóa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bộ Sưu Tập Của Tôi</h1>
  </header>

  <main class="grid">
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="Cảnh núi sông hùng vĩ lúc hoàng hôn">
      <figcaption>
        <p>Đây là bức ảnh chụp dãy núi hùng vĩ trong chuyến du lịch mùa hè vừa qua của tôi.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1016/400/300" alt="Con đường nhỏ đi qua rừng cây">
      <figcaption>
        <p>Con đường ngập tràn ánh nắng buổi sáng mang lại cảm giác bình yên và thư thái.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1025/400/300" alt="Chú chó nhỏ đáng yêu ngồi trên cỏ">
      <figcaption>
        <p>Thú cưng cún cưng của tôi đang tận hưởng không khí trong lành ngoài công viên.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1039/400/300" alt="Thành phố lên đèn về đêm">
      <figcaption>
        <p>Ánh đèn lung linh của thành phố về đêm tạo nên khung cảnh huyền ảo quyến rũ.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1050/400/300" alt="Bãi biển biển xanh cát trắng">
      <figcaption>
        <p>Làn nước biển xanh mát cùng tiếng sóng vỗ rì rào xua tan đi mọi căng thẳng.</p>
      </figcaption>
    </figure>
  </main>
</body>
</html>
